<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everyday Plate</title>
<style>

:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #17202C; --muted: #5A6575; --line: #D9DFE7; --track: #E6EAF0;
  --rim: #284887; --rim-ink: #FFFFFF; --rim-soft: #E6ECF7; --rim-strong: #213C73;
  --p: #B5452C; --c: #C99A2E; --c-ink: #8A600E; --f: #587636; --fib: #2E7D78;
  --warn-soft: #FBF1DE; --warn-ink: #6B4700; --danger: #A8321E;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --surface: #161D27; --ink: #E8EDF4; --muted: #9AA6B6; --line: #2A3442; --track: #243041;
    --rim: #8FAAE5; --rim-ink: #0E131A; --rim-soft: #1C2840; --rim-strong: #B9CCF4;
    --p: #E58A6E; --c: #E2B54B; --c-ink: #E9C46A; --f: #A6C474; --fib: #62BDB4;
    --warn-soft: #2E2615; --warn-ink: #F0CC86; --danger: #F08A73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --surface: #161D27; --ink: #E8EDF4; --muted: #9AA6B6; --line: #2A3442; --track: #243041;
  --rim: #8FAAE5; --rim-ink: #0E131A; --rim-soft: #1C2840; --rim-strong: #B9CCF4;
  --p: #E58A6E; --c: #E2B54B; --c-ink: #E9C46A; --f: #A6C474; --fib: #62BDB4;
  --warn-soft: #2E2615; --warn-ink: #F0CC86; --danger: #F08A73;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
.num, .tbl, .ro-n, .sh-a, .st-v, .big { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--rim); outline-offset: 2px; border-radius: 8px; }
.inp :focus-visible { outline: none; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 6px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-stretch: 112%; font-size: 18px; letter-spacing: -0.01em; }
.brand svg { width: 28px; height: 28px; flex: none; }
.status { margin: 0; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; text-align: right; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--f); flex: none; }
.status[data-ok="0"]::before { background: var(--danger); }

/* the plate: the one strong shape, used only for key numbers */
.plate {
  background: var(--surface); border: 3px solid var(--rim); border-radius: 24px; padding: 14px 16px 16px;
  box-shadow: inset 0 0 0 5px var(--surface), inset 0 0 0 6px var(--line);
}
.plate + .plate, .note + .plate { margin-top: 14px; }

h2 { font-size: 27px; font-stretch: 116%; font-weight: 750; letter-spacing: -0.02em; line-height: 1.1; margin: 6px 0 16px; }
.sec { font-size: 17px; font-stretch: 108%; font-weight: 700; margin: 28px 0 10px; }
.card-h { font-size: 16px; font-stretch: 108%; font-weight: 700; margin: 2px 0 8px; }
p { margin: 8px 0; }
.fine { font-size: 13.5px; color: var(--muted); }
.note { font-size: 14px; background: var(--rim-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; margin: 12px 0 0; }
.note.warn { background: var(--warn-soft); color: var(--warn-ink); }
.res-note { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.big { font-size: 34px; font-weight: 750; font-stretch: 120%; letter-spacing: -0.02em; line-height: 1.05; margin: 4px 0 8px; }
.big span { font-size: 14px; font-weight: 500; font-stretch: 100%; letter-spacing: 0; color: var(--muted); }
.err { color: var(--danger); font-size: 14px; margin: 8px 0 0; }
.err:empty { display: none; }

/* controls */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg); border: 1.5px solid var(--line); border-radius: 13px; padding: 3px; gap: 3px; }
.seg button { appearance: none; border: 0; background: none; font: inherit; font-weight: 650; font-size: 15px; color: var(--muted); padding: 8px 6px; border-radius: 10px; min-height: 42px; cursor: pointer; }
.seg button.on { background: var(--rim); color: var(--rim-ink); }
.btn { appearance: none; border: 1.5px solid var(--rim); background: var(--rim); color: var(--rim-ink); font: inherit; font-weight: 650; font-size: 15px; padding: 11px 16px; border-radius: 12px; min-height: 46px; cursor: pointer; margin-top: 8px; }
.btn.wide { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--rim-strong); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.link { appearance: none; border: 0; background: none; padding: 2px 0; font: inherit; font-weight: 650; color: var(--rim-strong); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; cursor: pointer; }
.link.sm { font-size: 13.5px; margin-top: 4px; display: inline-block; }
.step { appearance: none; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 20px; line-height: 1; display: grid; place-items: center; cursor: pointer; padding: 0; }
.step:active { background: var(--rim-soft); border-color: var(--rim); }

/* totals */
.bars { display: grid; gap: 10px; margin-top: 14px; }
.bar-row { display: grid; grid-template-columns: 1fr auto; row-gap: 5px; align-items: baseline; }
.bar-l { font-weight: 650; font-size: 14.5px; }
.bar-v { font-size: 14px; color: var(--muted); }
.bar-v b { color: var(--ink); font-weight: 750; font-size: 15.5px; }
.bar { grid-column: 1 / -1; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--rim); }
.bar-k .bar { height: 10px; border-radius: 5px; }
.bar-p i { background: var(--p); } .bar-c i { background: var(--c); } .bar-f i { background: var(--f); } .bar-fib i { background: var(--fib); }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }

/* menus and meals */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 18px -16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; appearance: none; font: inherit; font-size: 14.5px; font-weight: 650; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; min-height: 40px; }
.chip.on { border-color: var(--rim); background: var(--rim-soft); color: var(--rim-strong); }
.meal { padding: 16px 0 6px; border-top: 1px solid var(--line); }
.meal-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
.meal h3 { margin: 0; font-size: 18px; font-stretch: 110%; font-weight: 750; letter-spacing: -0.01em; }
.dish { margin: 1px 0 0; color: var(--muted); font-size: 14px; }
.meal-t { margin: 0; text-align: right; font-size: 13.5px; color: var(--muted); line-height: 1.35; white-space: nowrap; }
.items { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; }
.item + .item { border-top: 1px dashed var(--line); }
.ro { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; line-height: 1; }
.ro-n { font-size: 24px; font-weight: 750; font-stretch: 122%; letter-spacing: -0.02em; }
.ro-u { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; }
.ro.locked .ro-n { color: var(--rim-strong); }
.lk { width: 11px; height: 11px; color: var(--rim-strong); }
.it-main { min-width: 0; }
.sw { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
.sw select { field-sizing: content; appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 650; color: var(--ink); padding: 2px 18px 2px 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.chev { position: absolute; right: 0; width: 12px; height: 12px; pointer-events: none; color: var(--muted); }
.it-name { font-size: 16px; font-weight: 650; }
.it-meta { display: flex; flex-wrap: wrap; gap: 1px 9px; font-size: 13px; color: var(--muted); margin-top: 1px; }
.tp { color: var(--p); } .tc { color: var(--c-ink); } .tf { color: var(--f); }
.it-ctl { display: flex; gap: 6px; }
.add { position: relative; display: inline-flex; align-items: center; gap: 8px; margin: 4px 0 6px; color: var(--rim-strong); }
.add .plus { font-size: 18px; font-weight: 700; width: 22px; text-align: center; }
.add select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 650; color: var(--rim-strong); padding: 6px 0; cursor: pointer; }

/* forms */
.form { margin-top: 12px; }
.fld { display: grid; gap: 5px; margin-bottom: 12px; align-content: start; }
.fl { font-size: 14px; font-weight: 650; }
.inp { display: flex; align-items: center; background: var(--surface); border: 1.5px solid var(--line); border-radius: 11px; padding: 0 12px; min-height: 46px; position: relative; }
.inp:focus-within { border-color: var(--rim); box-shadow: 0 0 0 3px var(--rim-soft); }
.inp input, .inp select { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); padding: 10px 0; outline: none; appearance: none; -webkit-appearance: none; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.inp input::placeholder { color: var(--muted); opacity: .7; }
.inp.sel select { padding-right: 22px; cursor: pointer; }
.inp.sel .chev { right: 12px; }
.inp .u { color: var(--muted); font-size: 14px; margin-left: 6px; white-space: nowrap; }
.unit-sel { position: relative; display: inline-flex; align-items: center; flex: none; margin-left: 8px; }
.unit-sel select { flex: none; width: auto; color: var(--muted); font-size: 14px; padding-right: 18px; cursor: pointer; }
.hint { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0 10px; }
.editor:has(#fe-unit option:not([value="each"]):checked) #fe-each-wrap { display: none; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin: 2px 0 12px; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--rim); flex: none; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* results table */
.tbl { width: 100%; table-layout: fixed; border-collapse: collapse; }
.tbl th, .tbl td { text-align: right; padding: 8px 4px 8px 8px; border-bottom: 1px solid var(--line); font-size: 15px; }
.tbl thead th:first-child, .tbl tbody th { width: 38%; padding-left: 0; overflow-wrap: break-word; }
.tbl td { width: 31%; }
.tbl thead th { font-size: 12px; color: var(--muted); font-weight: 650; padding-top: 0; }
.tbl tbody th { text-align: left; font-weight: 650; }
.tbl tbody tr:last-child th, .tbl tbody tr:last-child td { border-bottom: 0; }
.tbl .tk td { font-size: 20px; font-weight: 750; font-stretch: 108%; letter-spacing: -0.02em; white-space: nowrap; }

/* progress */
.wform { margin-bottom: 4px; }
.chart { margin: 18px 0 4px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-dot { fill: var(--muted); opacity: .55; }
.ch-line { fill: none; stroke: var(--rim); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.ch-lab { fill: var(--muted); font-size: 10.5px; font-family: inherit; }
figcaption { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0 16px; align-items: end; }
.stats > div { display: grid; gap: 2px; }
.st-l { font-size: 13px; color: var(--muted); }
.st-v { font-size: 20px; font-weight: 750; font-stretch: 116%; white-space: nowrap; }
.st-v small { font-size: 13px; font-weight: 500; font-stretch: 100%; color: var(--muted); margin-left: 2px; }
.wlist { list-style: none; padding: 0; margin: 0; }
.wlist li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.wlist li > span:last-child { display: inline-flex; align-items: center; gap: 4px; }
.x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 21px; line-height: 1; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; }

/* shop and prep */
.shopfor { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stp { display: grid; gap: 6px; }
.stp-c { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; }
.stp-c b { font-size: 22px; font-stretch: 118%; }
.shop { list-style: none; margin: 10px 0 0; padding: 0; }
.shop li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.sh-n { font-weight: 650; }
.sh-a { font-weight: 750; font-stretch: 112%; text-align: right; white-space: nowrap; }
.sh-s { grid-column: 2 / -1; font-size: 13px; color: var(--muted); }
.sh-more { color: var(--warn-ink); }
.batch-out { margin-top: 4px; }
.uses { margin: 6px 0 0; padding-left: 18px; font-size: 14.5px; }
.uses li { margin: 6px 0; }
.safe { margin: 0; padding-left: 18px; }
.safe li { margin: 6px 0; }

/* foods */
.flist { list-style: none; padding: 0; margin: 0; }
.flist > li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.fr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
.fr-n { font-weight: 650; }
.fr-v { grid-column: 1; font-size: 13px; color: var(--muted); }
.fr .link { grid-row: 1 / span 2; grid-column: 2; }
.tag.ok { color: var(--f); background: transparent; border: 1px solid var(--f); }
.tag { font-size: 12px; color: var(--rim-strong); background: var(--rim-soft); padding: 1px 8px; border-radius: 999px; margin-left: 8px; font-weight: 650; vertical-align: 1px; }
.editor { background: var(--surface); border: 1.5px solid var(--rim); border-radius: 16px; padding: 14px; margin: 10px 0; }
.editor h4 { margin: 0 0 12px; font-size: 16px; font-stretch: 108%; }
.per { margin: 6px 0 8px; }

/* top tabs: sticky, so nothing pinned to the bottom of the screen can cover them */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin: 0 -16px 14px; padding: 0 8px; border-bottom: 1px solid var(--line); }
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, auto); justify-content: space-between; }
.tabs button { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 650; padding: 12px 7px 11px; min-height: 46px; white-space: nowrap; cursor: pointer; position: relative; }
.tabs button.on { color: var(--rim-strong); }
.tabs button.on::after { content: ""; position: absolute; left: 7px; right: 7px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--rim); }

/* week strip, quality lines, week table, intake */
.wkstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin: 0 0 12px; }
.wd { appearance: none; position: relative; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 7px 0 6px; font: inherit; display: grid; justify-items: center; gap: 1px; cursor: pointer; min-height: 50px; }
.wd-d { font-size: 13.5px; font-weight: 700; }
.wd-t { font-size: 11.5px; color: var(--muted); }
.wd-t.tr { color: var(--rim-strong); font-weight: 650; }
.wd.on { background: var(--rim); border-color: var(--rim); color: var(--rim-ink); }
.wd.on .wd-t { color: var(--rim-ink); }
.wd-now { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--p); }
.qual { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; gap: 9px; }
.q { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: baseline; }
.q-l { font-size: 14px; font-weight: 650; }
.q-v { font-size: 14px; color: var(--muted); text-align: right; }
.q-v b { color: var(--ink); font-weight: 750; }
.q-a { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; line-height: 1.4; }
.fine.tight { margin: -4px 0 14px; }
.check.screen { margin-top: 12px; }
/* v7.6: allergens for your own foods */
fieldset.al-set { border: 0; padding: 0; margin: 4px 0 12px; min-width: 0; }
.al-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 14px; }
.al-grid .check { margin-bottom: 6px; }
.q.bad .q-l, .q.bad .q-v b { color: var(--danger); }
.q-miss { font-size: 12.5px; color: var(--warn-ink); margin: 0; }
.menu-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 24px 0 0; }
.day-h { font-size: 21px; margin: 0; }
.menu-h + .chips { margin-top: 10px; }
.wtab { display: grid; gap: 6px; }
.wrow { display: grid; grid-template-columns: 70px minmax(0, 1fr) minmax(0, 1.25fr); gap: 8px; align-items: center; }
.wchk { display: flex; align-items: center; gap: 8px; font-weight: 650; cursor: pointer; }
.wchk input { width: 20px; height: 20px; accent-color: var(--rim); margin: 0; flex: none; }
.inp.mini { min-height: 42px; padding: 0 10px; }
.inp.mini select { padding: 8px 18px 8px 0; }
.inp.mini .chev { right: 10px; }
.intake { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.inrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: 6px; }
.inrow .btn { margin-top: 0; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.sec.first { margin-top: 4px; }

.q-salt { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted); }
.q-salt .inp.mini { min-height: 38px; width: 118px; }
.q-salt input { padding: 6px 0; }
.contains { margin-top: 14px; }
.audit { overflow-x: auto; margin: 10px 0 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.atbl { border-collapse: collapse; font-size: 13px; min-width: 640px; width: 100%; }
.atbl th, .atbl td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.atbl th:first-child, .atbl tbody th { text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--surface); }
.atbl thead th { color: var(--muted); font-weight: 650; }
.atbl tr.tot th, .atbl tr.tot td { font-weight: 750; border-bottom: 0; }
.split-h { margin-top: 16px; }
.dish-sw select { font-size: 15px; font-weight: 500; color: var(--muted); padding: 1px 18px 1px 0; }
.meal-h > div:first-child { min-width: 0; }
.menu-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 18px; margin: 6px 0 0; }
.menu-acts .inrow { width: 100%; }
.share-box { margin: 0 0 14px; }
.share-box textarea { width: 100%; font: inherit; font-size: 14px; line-height: 1.4; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px; margin: 6px 0 2px; resize: vertical; }
.srcs { margin: 0; padding-left: 18px; font-size: 14px; }
.srcs li { margin: 5px 0; }
a { color: var(--rim-strong); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* v7 */
.q.unk .q-v { color: var(--muted); }

const RANGES = {
  'profile.age': [10, 110], 'profile.height': [120, 230], 'profile.weight': [30, 300], 'profile.minutes': [0, 240], 'profile.goalWeight': [30, 300],
  'manual.training': [300, 8000], 'manual.rest': [300, 8000], 'manual.daily': [300, 8000], 'extraSalt': [0, 20], 'batch.raw': [1, 20000], 'batch.cooked': [1, 60000], 'batch.pot': [1, 60000], 'batch.portions': [1, 50]

function onField(el) {
  const path = el.dataset.field;
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.type === 'number') {
    v = num(el.value);
    if (v != null) {
      let r = RANGES[path];
      if (path === 'macros.pVal') r = S.macros.pUnit === 'day' ? [20, 400] : [0.8, 3.5];
      if (path === 'macros.fVal') r = S.macros.fUnit === 'day' ? [15, 250] : [0.3, 2];
      if (r) { const c = clamp(v, r[0], r[1]); if (c !== v) { v = c; el.value = c; } }
    }
  } else v = el.dataset.num ? Number(el.value) : el.value;
  const structural = el.type === 'checkbox' || (el.tagName === 'SELECT' && /(Unit|sessions)$/.test(path)) || /^profile\.(age|height|weight)$/.test(path);
  commit(s => {
    if (path === 'macros.pUnit' || path === 'macros.fUnit') {
      const k = path.charAt(7), T = computeTargets(s), cur = num(s.macros[k + 'Val']);
      if (cur != null && s.macros[k + 'Unit'] !== v) s.macros[k + 'Val'] = v === 'day' ? Math.round(cur * T.refWeight) : Math.round(cur / T.refWeight * 10) / 10;
    }
    if (path === 'profile.sessions') { const pat = TRAIN_PATTERNS[clamp(v, 0, 7)]; setDays(s, ds => ds.forEach((d, i) => { d.type = pat.includes(i) ? 'training' : 'rest'; })); }
    setPath(s, path, v);
  }, structural || !['targets', 'progress', 'shop'].includes(UI.tab) ? 'full' : 'partial');
}
function partial() {
  if (UI.tab === 'targets') {
    const T = computeTargets(S), r = document.getElementById('t-results');
    if (r) r.innerHTML = resultsHTML(T);
    ['p', 'f'].forEach(k => { const h = document.getElementById('h-' + k); if (h) h.textContent = macroHint(k, T); });
    const rs = document.getElementById('f-profile-rate');
    if (rs) rs.innerHTML = rateOpts(T).map(([v, l]) => '<option value="' + v + '"' + sel(String(T.rate) === String(v)) + '>' + l + '</option>').join('');
  } else if (UI.tab === 'progress') { const c = document.getElementById('m-card'); if (c) c.innerHTML = estimateHTML(); }
  else if (UI.tab === 'shop') { const o = document.getElementById('b-out'); if (o) o.innerHTML = batchOutHTML(); const sp = document.getElementById('b-split'); if (sp) sp.innerHTML = splitHTML(); }
  renderStatus();
}

  const m = document.getElementById('main');

  document.querySelectorAll('#tabs button').forEach(b => { const on = b.dataset.tab === navTab; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  renderStatus();
  if (loadProblem) { showToast('Your saved plan on this device couldn’t be read, so the planner started fresh.' + (loadProblem === 'kept' ? ' A copy of the old data is kept in this browser.' : ''), false); loadProblem = null; }
  else if (rolled) showToast(rolled.carried ? 'New week. Your plan from the week of ' + weekLabel(rolled.from) + ' carries on; purchase ticks start fresh.' : 'New week. Showing the week of ' + weekLabel(rolled.to) + ', which you planned earlier.', false);
}

function onTabsClick(e) {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  UI.tab = b.dataset.tab; UI.editFood = null; UI.clearArm = false; UI.wErr = ''; UI.inErr = ''; UI.saveMenu = false; UI.shareText = null; UI.audit = false; UI.resetWeekArm = false; UI.importErr = ''; UI.importReady = null;
  window.scrollTo(0, 0); render();
}
function onMainClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  const fn = A[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
}
function onMainChange(e) {
  const el = e.target;
  if ((el.tagName === 'SELECT' || el.tagName === 'INPUT') && el.dataset.act) { const fn = A[el.dataset.act]; if (fn) fn(el, e); return; }
  if (el.dataset && el.dataset.field) onField(el);
}
function onUndo() { A.undo(); }
function onToast(e) { if (e.target.closest('[data-undo]')) A.undo(); }
function mount() {
  const tabs = document.getElementById('tabs');
  const main = document.getElementById('main');
  const undo = document.getElementById('undo');
  const toast = document.getElementById('toast');
  if (!tabs || !main || !undo || !toast) return function () {};
  tabs.addEventListener('click', onTabsClick);
  main.addEventListener('click', onMainClick);
  main.addEventListener('change', onMainChange);
  undo.addEventListener('click', onUndo);
  toast.addEventListener('click', onToast);
  render();
  Cloud.init();
  getDownloads().then(dl => { UI.canDownload = !!dl; if (dl && UI.tab === 'targets') render(); });
  return function unmount() {
    tabs.removeEventListener('click', onTabsClick);
    main.removeEventListener('click', onMainClick);
    main.removeEventListener('change', onMainChange);
    undo.removeEventListener('click', onUndo);
    toast.removeEventListener('click', onToast);
  };
}
window.EverydayPlate = { mount: mount };
})();

</script>
<script>EverydayPlate.mount();</script>
</body>
